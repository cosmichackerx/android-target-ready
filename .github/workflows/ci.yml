name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  action-metadata:
    name: action.yml metadata (Marketplace limits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: name, description (max 125 characters) and branding are present and valid
        run: |
          python3 - <<'PY'
          import re
          t = open("action.yml", encoding="utf-8").read()
          name = re.search(r"^name:\s*(.+)$", t, re.M).group(1).strip().strip('"')
          desc = re.search(r"^description:\s*(.+)$", t, re.M).group(1).strip().strip('"')
          icon = re.search(r"^  icon:\s*(\S+)", t, re.M)
          color = re.search(r"^  color:\s*(\S+)", t, re.M)
          assert name, "name missing"
          assert 0 < len(desc) <= 125, f"description is {len(desc)} characters; the Marketplace allows at most 125"
          assert icon and color, "branding icon and color are required"
          assert color.group(1) in {"white", "black", "yellow", "blue", "green", "orange", "red", "purple", "gray-dark"}, color.group(1)
          print(f"ok: {name!r}, description {len(desc)} characters, icon {icon.group(1)}, color {color.group(1)}")
          PY
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install .
      - run: python -m pytest -q
      - name: Installed CLI runs
        run: |
          android-target-ready --version
          android-target-ready --list-rules

  claims:
    name: README claims (claims-check)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install pytest .
      - uses: cosmichackerx/claims-check@v0.1.0

  package:
    name: build wheel and sdist, install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install the wheel into a clean venv and scan a fixture
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/android-target-ready tests/fixtures/app-needs-work --fail-on never | tail -3

  action-selftest:
    name: action-selftest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fixture that needs work must fail the step
        id: bad
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/app-needs-work
          sarif-file: ${{ runner.temp }}/atr.sarif
      - name: It really failed and wrote SARIF
        run: |
          if [ "${{ steps.bad.outcome }}" != "failure" ]; then echo "expected failure, got ${{ steps.bad.outcome }}"; exit 1; fi
          python3 -c "import json,sys;j=json.load(open(sys.argv[1]));r=[x['ruleId'] for x in j['runs'][0]['results']];assert j['version']=='2.1.0' and 'edge-to-edge-opt-out' in r and 'play-target-floor' in r, r;print('results:',len(r))" "$RUNNER_TEMP/atr.sarif" || python -c "import json,sys;j=json.load(open(sys.argv[1]));r=[x['ruleId'] for x in j['runs'][0]['results']];assert j['version']=='2.1.0' and 'edge-to-edge-opt-out' in r and 'play-target-floor' in r, r;print('results:',len(r))" "$RUNNER_TEMP/atr.sarif"
      - name: fail-on never lets the same fixture pass
        uses: ./
        with:
          path: tests/fixtures/app-needs-work
          fail-on: never
      - name: Ready fixture passes
        uses: ./
        with:
          path: tests/fixtures/app-ready
      - name: disable and target inputs are honoured
        uses: ./
        with:
          path: tests/fixtures/app-needs-work
          target: "36"
          disable: "play-target-floor edge-to-edge-opt-out fixed-orientation non-resizeable"
          fail-on: error

  consumer:
    # Uses the published release the way a user's workflow would.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cosmichackerx/android-target-ready@v0.1.0
        with:
          path: tests/fixtures/app-ready
          fail-on: error

  pr-mode-selftest:
    name: pr-mode-selftest (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Nothing is new against the base, so the failing fixture passes in PR mode
        uses: ./
        with:
          path: tests/fixtures/app-needs-work
          pr-mode: "true"
      - name: Add a finding that the base does not have
        run: |
          printf 'class Added : AppCompatActivity() {\n  override fun onBackPressed() {}\n  fun k(c: Int) = c == KeyEvent.KEYCODE_BACK\n}\n' > tests/fixtures/app-ready/app/src/main/java/Added.kt
      - name: The new finding is reported and (as warning) fails with fail-on warning
        id: added
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/app-ready
          pr-mode: "true"
          fail-on: warning
      - name: It failed because of the new finding
        run: |
          if [ "${{ steps.added.outcome }}" != "failure" ]; then echo "expected failure, got ${{ steps.added.outcome }}"; exit 1; fi

  comment-selftest:
    name: sticky comment (same-repo pull requests)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Add a finding that the base does not have
        run: |
          printf 'class Added : AppCompatActivity() {\n  override fun onBackPressed() {}\n}\n' > tests/fixtures/app-ready/app/src/main/java/Added.kt
      - name: Run with comment
        uses: ./
        with:
          path: tests/fixtures/app-ready
          comment: "true"
          fail-on: never
      - name: Run again (must update, not add a second comment)
        uses: ./
        with:
          path: tests/fixtures/app-ready
          comment: "true"
          fail-on: never
      - name: Exactly one sticky comment exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --paginate -q '.[]|select(.body|contains("android-target-ready:sticky"))|.id' | wc -l | tr -d ' ')
          echo "sticky comments: $n"
          test "$n" = "1"

  dependabot-gaps:
    name: dependabot-gaps (released action, consumer test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cosmichackerx/dependabot-gaps@v0.2.0
        with:
          fail-on: warning
          # on pull requests: only gaps the PR introduces (needs fetch-depth: 0 above)
          pr-mode: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
