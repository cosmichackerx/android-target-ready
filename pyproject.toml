[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "android-target-ready"
version = "0.2.3"
description = "Static scan of an Android project (Kotlin, Java, Gradle, manifests, resources) for what changes when targetSdk moves to 36 and 37: edge-to-edge, predictive back, large-screen orientation, local network permission and more. SARIF and GitHub Action included."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Muhammad Arslan", email = "cosmichackerx@users.noreply.github.com" }]
keywords = ["android", "targetsdk", "android-16", "android-17", "api-36", "api-37", "edge-to-edge", "predictive-back", "kotlin", "gradle", "lint", "sarif", "google-play", "migration"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/cosmichackerx/android-target-ready"
Issues = "https://github.com/cosmichackerx/android-target-ready/issues"

[project.scripts]
android-target-ready = "android_target_ready.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
